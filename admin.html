<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f6f7" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Workspace | Fenil Dholariya</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css?v=20260709e" />
  <link rel="stylesheet" href="/css/admin.css?v=20261001cms" />
  <link rel="stylesheet" href="/css/admin-workspace.css?v=20261005work" />
  <link rel="stylesheet" href="/css/liquid-admin.css?v=20261004optical4" />
</head>
<body data-page="admin">
  <div class="admin-login" id="loginView">
    <form class="admin-login__card glass" id="loginForm" autocomplete="off">
      <div class="brand"><span class="brand__mark"><img src="/assets/fd-mark-v2.svg" alt="" width="34" height="34" /></span> Fenil Workspace</div>
      <h1>Sign in</h1>
      <p class="text-muted">Manage content for the Fenil Dholariya portfolio.</p>
      <div class="field"><label for="loginPassword">Password</label><input class="input" id="loginPassword" type="password" required autocomplete="current-password" /></div>
      <button class="btn btn--primary btn--block" type="submit" id="loginSubmit">Sign in</button>
      <p class="form-status" id="loginStatus" role="status"></p>
    </form>
  </div>

  <svg class="admin-icons" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="admin-i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="admin-i-page" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="admin-i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="admin-i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 3-4 5 6"/></symbol>
    <symbol id="admin-i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="admin-i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h17M8 16v-4M13 16V7M18 16v-7"/></symbol>
    <symbol id="admin-i-chat" viewBox="0 0 24 24"><path d="M4 5h16v12H9l-5 4V5Z"/><path d="M8 9h8M8 13h5"/></symbol>
    <symbol id="admin-i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="admin-i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="admin-i-logout" viewBox="0 0 24 24"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5M14 8l4 4-4 4M8 12h10"/></symbol>
  </svg>

  <div class="admin" id="dashboardView" style="display:none">
    <aside class="admin__sidebar" id="adminSidebar" aria-label="Workspace navigation">
      <div class="admin__sidebar-brand"><span class="admin__brand-mark"><img src="/assets/fd-mark-v2.svg" alt="" width="28" height="28" /></span><span><strong>Fenil Dholariya</strong><small>Workspace</small></span></div>
      <label class="admin__search"><svg><use href="#admin-i-search"></use></svg><input id="adminNavSearch" type="search" placeholder="Find a task..." aria-label="Find a task" /></label>
      <nav class="admin__tabs" id="adminTabs" aria-label="Admin sections">
        <div class="admin__nav-group" data-nav-group><p class="admin__nav-label">Website</p>
          <button class="admin__tab is-active" data-tab="home"><svg><use href="#admin-i-page"></use></svg><span>Home page</span></button>
          <button class="admin__tab" data-tab="services"><svg><use href="#admin-i-layers"></use></svg><span>Services page</span></button>
          <button class="admin__tab" data-tab="work"><svg><use href="#admin-i-layers"></use></svg><span>Work page</span></button>
          <button class="admin__tab" data-tab="projects"><svg><use href="#admin-i-layers"></use></svg><span>Case studies</span></button>
          <button class="admin__tab" data-tab="gallery"><svg><use href="#admin-i-image"></use></svg><span>Gallery</span></button>
          <button class="admin__tab" data-tab="posts"><svg><use href="#admin-i-page"></use></svg><span>Blog</span></button>
          <button class="admin__tab" data-tab="profile"><svg><use href="#admin-i-user"></use></svg><span>About &amp; profile</span></button>
          <button class="admin__tab" data-tab="leads"><svg><use href="#admin-i-chat"></use></svg><span>Contact leads</span></button>
        </div>
        <div class="admin__nav-group" data-nav-group><p class="admin__nav-label">Shared resources</p>
          <button class="admin__tab" data-tab="footer"><svg><use href="#admin-i-layers"></use></svg><span>Footer</span></button>
          <button class="admin__tab" data-tab="stats"><svg><use href="#admin-i-chart"></use></svg><span>Stats</span></button>
          <button class="admin__tab" data-tab="process"><svg><use href="#admin-i-grid"></use></svg><span>Process</span></button>
          <button class="admin__tab" data-tab="testimonials"><svg><use href="#admin-i-chat"></use></svg><span>Testimonials</span></button>
          <button class="admin__tab" data-tab="skills"><svg><use href="#admin-i-grid"></use></svg><span>Skills</span></button>
          <button class="admin__tab" data-tab="timeline"><svg><use href="#admin-i-chart"></use></svg><span>Timeline</span></button>
        </div>
      </nav>
      <div class="admin__sidebar-foot"><span class="admin__account-mark">FD</span><span class="admin__account"><strong>Fenil Admin</strong><small>Site administrator</small></span><button id="logoutBtn" class="admin__logout" title="Sign out" aria-label="Sign out"><svg><use href="#admin-i-logout"></use></svg></button></div>
    </aside>
    <button class="admin__backdrop" id="adminSidebarBackdrop" type="button" aria-label="Close navigation"></button>
    <div class="admin__workspace">
      <header class="admin__topbar"><div class="admin__breadcrumbs"><button id="adminMenuToggle" class="admin__menu-toggle" type="button" aria-label="Open navigation"><svg><use href="#admin-i-menu"></use></svg></button><span>Workspace</span><span class="admin__breadcrumb-divider">/</span><strong id="adminCurrentPage">Home page</strong></div><a href="/" target="_blank" rel="noopener" class="admin__view-site">View website <span aria-hidden="true">↗</span></a></header>
      <div class="admin__banner" id="dbBanner" style="display:none"><span id="dbBannerText">Database not connected yet. Connect it to edit content.</span><button class="btn btn--primary btn--sm" id="setupBtn">Initialize database</button></div>
      <main class="admin__panels">
        <section class="admin__panel is-active" id="panel-home"></section>
        <section class="admin__panel" id="panel-footer"></section>
        <section class="admin__panel" id="panel-profile"></section>
        <section class="admin__panel" id="panel-stats"></section>
        <section class="admin__panel" id="panel-services"></section>
        <section class="admin__panel" id="panel-work"></section>
        <section class="admin__panel" id="panel-process"></section>
        <section class="admin__panel" id="panel-projects"></section>
        <section class="admin__panel" id="panel-posts"></section>
        <section class="admin__panel" id="panel-testimonials"></section>
        <section class="admin__panel" id="panel-skills"></section>
        <section class="admin__panel" id="panel-timeline"></section>
        <section class="admin__panel" id="panel-leads"></section>
        <section class="admin__panel" id="panel-gallery"></section>
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=20260710"></script>
  <script type="module" src="/js/admin.js?v=20261005work"></script>
</body>
</html>
